<!DOCTYPE html>
<html lang="en">
    <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PSIDE</title>
	<script src="/uplot.min.js"></script>
	<link rel="stylesheet" href="/uplot.min.css">
	<style>
:root {
    --bg:       #060708;
    --bg2:      #1a1f27;
    --bg2-glass: rgba(26, 31, 39, 0.72);
    --bg3:      #232935;
    --bg3-glass: rgba(35, 41, 53, 0.6);
    --border:   #2c3340;
    --border2:  #3e4856;
    --text:     #c9d1dc;
    --text-dim: #7c8798;
    --text-mid: #8893a4;
    --accent:   #4af0b0;
    --accent2:  #3dd8fb;
    --warn:     #f0a44a;
    --mono:     ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', monospace;
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    overflow: hidden;
}

#bg-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    perspective: 400px;
    perspective-origin: calc(50% + var(--gx, 0px)) calc(30% + var(--gy, 0px));
    transition: perspective-origin 0.4s ease-out;
}
#bg-grid::before {
    content: '';
    position: absolute;
    left: -50%; right: -50%; bottom: -10%;
    height: 160%;
    background-image:
        linear-gradient(var(--border2) 1px, transparent 1px),
        linear-gradient(90deg, var(--border2) 1px, transparent 1px);
    background-size: 48px 48px;
    transform: rotateX(75deg);
    transform-origin: bottom;
    opacity: 0.4;
    mask-image: linear-gradient(to top, black, transparent 65%);
    -webkit-mask-image: linear-gradient(to top, black, transparent 65%);
    animation: gridDrift 10s linear infinite;
}
@keyframes gridDrift { from { background-position: 0 0, 0 0; } to { background-position: 0 48px, 0 0; } }

#app {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-rows: 40px 1fr;
    grid-template-columns: 260px 1fr;
    gap: 14px;
    padding: 14px;
    height: 100vh;
    overflow: hidden;
    animation: appIn 0.4s ease both;
}
@keyframes appIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

#topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    background: var(--bg2-glass);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 24px -14px rgba(0,0,0,.65);
    flex-shrink: 0;
}

.logo {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    text-shadow: 0 0 12px rgba(74, 240, 176, 0.35), 0 1px 0 rgba(0,0,0,.6), 0 2px 3px rgba(0,0,0,.35);
}
.logo span { color: var(--text-dim); font-weight: 300; }
.logo .cursor {
    color: var(--accent);
    margin-left: 3px;
    animation: blink 1.1s steps(1) infinite;
}
@keyframes blink { 50%, 100% { opacity: 0; } }

.sep { width: 1px; height: 18px; background: var(--border2); }

#top-meta {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    gap: 20px;
}
#top-meta b { color: var(--text-mid); font-weight: 400; }

.status {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
}
.status .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

#sidebar {
    background: var(--bg2-glass);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 14px 30px -16px rgba(0,0,0,.65);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
}

#sidebar-header {
    background: var(--bg2);
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
}
#sidebar-header .label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
}

#search {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 3px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 8px;
    outline: none;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.3);
    transition: border-color 0.15s, box-shadow 0.15s;
}
#search::placeholder { color: var(--text-dim); }
#search:focus { border-color: var(--accent); box-shadow: inset 0 1px 3px rgba(0,0,0,.3), 0 0 0 3px rgba(74, 240, 176, 0.12); }

#section-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
    min-height: 0;
}
#section-list::-webkit-scrollbar { width: 4px; }
#section-list::-webkit-scrollbar-track { background: transparent; }
#section-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.section-item {
    padding: 7px 14px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.12s, border-color 0.12s, padding-left 0.15s var(--ease-bounce), transform 0.1s var(--ease-bounce);
    display: flex;
    flex-direction: column;
    gap: 2px;
    opacity: 0;
    transform: translateX(-4px);
    animation: itemIn 0.2s ease forwards;
}
@keyframes itemIn { to { opacity: 1; transform: none; } }
.section-item:hover  { background: var(--bg3-glass); border-left-color: var(--border2); padding-left: 17px; }
.section-item.active {
    background: var(--bg3-glass);
    border-left-color: var(--accent);
    box-shadow: inset 12px 0 20px -18px var(--accent);
}
.section-item:active { transform: scale(0.98); }
.section-item.static { animation: none; opacity: 1; transform: none; }

.section-item .name {
    color: var(--text);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.section-item.active .name { color: var(--accent); }

.section-item .stats { display: flex; gap: 8px; font-size: 10px; color: var(--text-dim); align-items: center; }
.section-item .stats .pill {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 0 4px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), inset 0 -1px 1px rgba(0,0,0,.35);
}

#main {
    background: var(--bg2-glass);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 14px 30px -16px rgba(0,0,0,.65);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
    position: relative;
}

#section-header {
    background: var(--bg2);
    padding: 11px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: baseline;
    gap: 14px;
}
#section-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
#section-title.placeholder { color: var(--text-dim); font-weight: 300; font-size: 13px; }
#section-summary {
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
    display: flex;
    gap: 6px;
    align-items: center;
}
#section-summary .pill {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 1px 6px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), inset 0 -1px 1px rgba(0,0,0,.35);
}

#unit-picker {
    display: flex;
    align-items: center;
    gap: 1px;
    flex-shrink: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), inset 0 -1px 1px rgba(0,0,0,.35);
}
#unit-picker .unit-lbl {
    font-size: 9px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 0 5px 0 4px;
}
#unit-picker button {
    font-family: inherit;
    font-size: 10px;
    color: var(--text-dim);
    background: transparent;
    border: 0;
    border-radius: 2px;
    padding: 2px 7px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .12s, background .12s, transform .12s var(--ease-bounce);
}
#unit-picker button:hover { color: var(--text); background: var(--bg3-glass); }
#unit-picker button:active { transform: scale(.94); }
#unit-picker button.active {
    color: var(--bg);
    background: var(--accent);
    font-weight: 600;
}

#empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-dim);
    font-size: 12px;
}
#empty-state .big {
    font-size: 42px;
    opacity: .14;
    letter-spacing: .25em;
    text-shadow: 0 6px 16px rgba(0,0,0,.5);
    animation: breathe 3.6s ease-in-out infinite;
}
@keyframes breathe { 50% { opacity: .22; transform: scale(1.06); } }
#empty-state.hidden { display: none; }

#charts-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-height: 0;
}
#charts-scroll::-webkit-scrollbar { width: 6px; }
#charts-scroll::-webkit-scrollbar-track { background: transparent; }
#charts-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.ip-card {
    background: color-mix(in srgb, var(--bg2) 55%, transparent);
    border: 1px solid color-mix(in srgb, var(--border) 65%, transparent);
    border-radius: 7px;
    opacity: 0;
    position: relative;
    transform: translateY(4px);
    animation: cardIn 0.2s ease forwards;
    flex-shrink: 0;
    transition: background .12s, border-color .12s, margin .25s var(--ease-bounce);
}
@keyframes cardIn { to { opacity: 1; transform: none; } }
.ip-card:not(.expanded) { margin: 2px 0; }
.ip-card:hover {
    background: color-mix(in srgb, var(--vc-fg, var(--text-mid)) 8%, var(--bg2));
    border-color: color-mix(in srgb, var(--vc-fg, var(--border2)) 35%, var(--border));
}
.ip-card.expanded {
    background: var(--bg2-glass);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid var(--border);
    border-radius: 7px;
    margin: 8px 0;
    box-shadow: 0 16px 34px -20px rgba(0,0,0,.75);
}

.ip-card-header {
    padding: 6px 10px 6px 9px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 200px 84px 12px;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    user-select: none;
}
.ip-card.expanded .ip-card-header {
    border-bottom: 1px solid var(--border);
    background: var(--bg3-glass);
    padding: 9px 12px;
}

.row-loc {
    min-width: 0;
    font-size: 12px;
    color: var(--text-mid);
    letter-spacing: .02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color .12s;
}
.ip-card:hover .row-loc, .ip-card.expanded .row-loc { color: var(--text); }

.row-band { position: relative; height: 14px; }
.row-band i { position: absolute; display: block; }
.rb-track { left: 0; right: 0; top: 6px; height: 2px; border-radius: 1px; background: var(--border); }
.rb-fill { top: 5px; height: 4px; border-radius: 2px; opacity: .45; transition: opacity .15s; }
.rb-zero { top: 1px; height: 12px; border-left: 1px dashed color-mix(in srgb, var(--text-dim) 55%, transparent); }
.rb-mid { top: 1px; height: 12px; width: 2px; border-radius: 1px; transform: translateX(-1px); }
.row-band.over::after {
    content: '›';
    position: absolute; right: -8px; top: -2px;
    font-size: 11px; color: var(--text-dim);
}
.ip-card:hover .rb-fill { opacity: .8; }

.row-num {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .01em;
    text-align: right;
    white-space: nowrap;
    color: var(--vc-fg, var(--text-dim));
    font-variant-numeric: tabular-nums;
}
.chart-counts .stat[data-note]::after {
    content: attr(data-note);
    position: absolute;
    bottom: calc(100% + 7px);
    left: 0;
    width: 270px;
    padding: 8px 10px;
    border-radius: 5px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--text-mid);
    font-style: normal;
    font-size: 10.5px;
    line-height: 1.5;
    text-align: left;
    white-space: normal;
    box-shadow: 0 12px 26px -10px rgba(0,0,0,0.85);
    opacity: 0;
    transform: translate(0, 3px);
    pointer-events: none;
    transition: opacity 0.14s, transform 0.14s;
    z-index: 20;
}
.chart-counts .stat[data-note]:hover::after { opacity: 1; transform: translate(0, 0); }

.ip-expand-icon {
    font-size: 10px;
    color: var(--text-dim);
    transition: transform 0.3s var(--ease-bounce), color 0.15s;
    flex-shrink: 0;
}
.ip-card-header:hover .ip-expand-icon { color: var(--text-mid); }
.ip-card.expanded .ip-expand-icon { transform: rotate(90deg); color: var(--accent); }

.ip-chart-body {
    display: grid;
    grid-template-rows: 0fr;
    perspective: 600px;
    transition: grid-template-rows 0.3s var(--ease-bounce);
}
.ip-card.expanded .ip-chart-body { grid-template-rows: 1fr; }
.ip-chart-body-inner {
    overflow: hidden;
    min-height: 0;
    padding: 0 8px;
    opacity: 0;
    transform: rotateX(-20deg);
    transform-origin: top center;
    transition: transform 0.35s var(--ease-bounce), opacity 0.25s ease, padding 0.3s var(--ease-bounce);
}
.ip-card.expanded .ip-chart-body-inner { padding: 8px 8px 4px; opacity: 1; transform: rotateX(0deg); }

.u-legend { display: none !important; }
.u-wrap   { background: transparent !important; }
.u-over   { cursor: crosshair; }

.u-cursor-x { border-right: 1px dashed rgba(124,135,152,0.35) !important; }
.u-cursor-pt {
    box-shadow: 0 0 10px 1px rgba(255,255,255,0.35);
    animation: ptPop 0.16s var(--ease-bounce);
}
@keyframes ptPop { from { transform: translate(-50%, -50%) scale(0.1); } }
.chart-tip {
    position: absolute;
    z-index: 6;
    transform: translate(-50%, calc(-100% - 9px));
    pointer-events: none;
    display: flex; align-items: baseline; gap: 7px;
    padding: 3px 8px;
    background: var(--bg3-glass);
    backdrop-filter: blur(8px) saturate(160%);
    -webkit-backdrop-filter: blur(8px) saturate(160%);
    border: 1px solid var(--border2);
    border-radius: 4px;
    font-size: 11px; line-height: 1.4; white-space: nowrap;
    color: var(--text-mid);
    box-shadow: 0 8px 20px -10px rgba(0,0,0,0.75);
    opacity: 0;
    transition: opacity 0.12s ease;
}
.chart-tip .tip-val { font-weight: 600; font-size: 13px; letter-spacing: .02em; }
.chart-tip .tip-spd { color: var(--text-mid); }
.chart-tip .tip-ci  { color: var(--text-dim); }
.chart-tip .tip-n   { color: var(--text-dim); font-size: 10px; }

.chart-legend {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 5px 8px 2px;
    margin-top: 4px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-mid);
    flex-wrap: wrap;
}
.chart-legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
}
.chart-legend-item svg { flex-shrink: 0; display: block; }

.chart-counts {
    display: flex;
    flex-wrap: wrap;
    gap: 9px 28px;
    padding: 7px 8px 3px;
}
.chart-counts .stat { position: relative; display: flex; flex-direction: column; gap: 1px; }
.chart-counts .stat .k {
    font-size: 8.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
}
.chart-counts .stat .v {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-mid);
    line-height: 1.35;
    white-space: nowrap;
}
.chart-counts .stat .v u { text-decoration: none; font-weight: 400; font-size: 10px; color: var(--text-dim); }
.chart-counts .stat[data-note] { cursor: help; }
.chart-counts .stat.thin .v { color: #f07a8c; }
.chart-counts .stat.thin .k { color: color-mix(in srgb, #f07a8c 55%, var(--text-dim)); }

.spinner {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--accent), var(--accent2), transparent 65%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.spark {
    position: fixed;
    width: 4px; height: 4px;
    border-radius: 1px;
    pointer-events: none;
    z-index: 9999;
    animation: sparkFly 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
}
@keyframes sparkFly {
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--spin)) scale(0.2); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
    #app, .section-item, .ip-card, #empty-state .big, .logo .cursor, .status .dot, #bg-grid::before {
        animation: none !important;
    }
    .section-item, .ip-card { opacity: 1; transform: none; }
    .ip-card::after { display: none !important; }
    .ip-chart-body-inner { transform: none !important; }
    .u-cursor-pt { animation: none !important; }
}

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    #topbar, #sidebar, #main, .ip-card { background: var(--bg2); }
    .section-item:hover, .section-item.active,
    .ip-card-header:hover, .ip-card.expanded .ip-card-header { background: var(--bg3); }
}</style>
    </head>
    <body>
	<div id="bg-grid"></div>
	<div id="app">

	    <header id="topbar">
		<div class="logo">p<span>side</span><span class="cursor">_</span></div>
		<div class="sep"></div>
		<div id="top-meta">
		    <span><b id="meta-sections">--</b> <span id="meta-sections-l">sections</span></span>
		    <span><b id="meta-graphs">--</b> <span id="meta-graphs-l">graphs</span></span>
		</div>
		<div class="status"><div class="dot"></div>local</div>
	    </header>

	    <nav id="sidebar">
		<div id="sidebar-header">
		    <div class="label">Sections</div>
		    <input id="search" type="text" placeholder="filter…" autocomplete="off" spellcheck="false">
		</div>
		<div id="section-list"></div>
	    </nav>

	    <main id="main">
		<div id="section-header">
		    <div id="section-title" class="placeholder">select a section</div>
		    <div id="section-summary"></div>
		    <div id="unit-picker"></div>
		</div>

		<div id="empty-state">
		    <div class="big">∅</div>
		    <span id="empty-msg">no section selected</span>
		</div>

		<div id="charts-scroll" style="display:none"></div>
	    </main>

	</div>
	<script>
	    const PALETTE = [
		'#199e70','#3987e5','#9085e9','#d55181',
		'#d95926','#c98500','#008300','#e66767',
	    ];

	    const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

	    const chartHeight = (w) => w ? Math.max(160, Math.round(w / 3)) : Math.max(200, Math.round(window.innerWidth * 0.22));

	    let sections  = [];
	    let activeVma = null;
	    let allSeries = [];
	    const cardState = new Map();

	    function countUp(el, target) {
		if (reducedMotion || target <= 0) { el.textContent = target; return; }
		const dur = 600, start = performance.now();
		const tick = now => {
		    const p = Math.min(1, (now - start) / dur);
		    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
		    if (p < 1) requestAnimationFrame(tick);
		};
		requestAnimationFrame(tick);
	    }

	    function spawnSparks(x, y, color, count) {
		if (reducedMotion) return;
		for (let i = 0; i < count; i++) {
		    const s = document.createElement('span');
		    s.className = 'spark';
		    s.style.background = color;
		    s.style.left = x + 'px';
		    s.style.top = y + 'px';
		    const angle = Math.random() * Math.PI * 2;
		    const dist = 14 + Math.random() * 26;
		    s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
		    s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
		    s.style.setProperty('--spin', Math.floor(Math.random() * 360) + 'deg');
		    document.body.appendChild(s);
		    s.addEventListener('animationend', () => s.remove());
		}
	    }

	    (async () => {
		try {
		    sections = await (await fetch('/api/vmas')).json();
		    const graphTotal = sections.reduce((n, s) => n + s.graph_count, 0);
		    countUp(document.getElementById('meta-sections'), sections.length);
		    countUp(document.getElementById('meta-graphs'), graphTotal);
		    document.getElementById('meta-sections-l').textContent = sections.length === 1 ? 'section' : 'sections';
		    document.getElementById('meta-graphs-l').textContent = graphTotal === 1 ? 'graph' : 'graphs';
		    renderSidebar(sections);
		    if (sections.length === 1) loadSection(sections[0].name);
		} catch {
		    showEmpty('failed to load sections');
		}
	    })();

	    function renderSidebar(items, animate = true) {
		const list = document.getElementById('section-list');
		list.innerHTML = '';
		if (!items.length) {
		    list.innerHTML = '<div style="padding:16px 14px;color:var(--text-dim);font-size:11px">no sections found</div>';
		    return;
		}
		items.forEach((s, i) => {
		    const el = document.createElement('div');
		    el.className = 'section-item' + (s.name === activeVma ? ' active' : '') + (animate ? '' : ' static');
		    el.dataset.vma = s.name;
		    if (animate) el.style.animationDelay = Math.min(i * 20, 300) + 'ms';
		    el.innerHTML = `
		      <div class="name" title="${esc(s.name)}">${esc(s.name)}</div>
		      <div class="stats">
			<span class="pill">${s.graph_count} graph${s.graph_count !== 1 ? 's' : ''}</span>
		      </div>`;
		    el.addEventListener('click', (e) => {
			spawnSparks(e.clientX, e.clientY, 'var(--accent)', 5);
			loadSection(s.name);
		    });
		    list.appendChild(el);
		});
	    }

	    document.getElementById('search').addEventListener('input', e => {
		const q = e.target.value.toLowerCase();
		renderSidebar(sections.filter(s => s.name.toLowerCase().includes(q)), false);
	    });

	    async function loadSection(vma) {
		if (vma === activeVma) return;
		activeVma = vma;

		document.querySelectorAll('.section-item').forEach(el =>
		    el.classList.toggle('active', el.dataset.vma === vma));

		const titleEl = document.getElementById('section-title');
		titleEl.textContent = vma;
		titleEl.classList.remove('placeholder');
		document.getElementById('section-summary').innerHTML = '';

		resetCards();
		allSeries = [];

		showEmpty(null, true);

		try {
		    const data = await (await fetch('/api/vma?name=' + encodeURIComponent(vma))).json();
		    renderSection(data);
		} catch {
		    showEmpty('failed to load section data');
		}
	    }

	    function resetCards() {
		cardState.forEach(s => s.plot?.destroy());
		cardState.clear();
	    }

	    function seriesStats(s) {
		const n = s.points.length;
		let lo = 0, mid = 0, hi = 0;
		for (const p of s.points) { lo += p.ci_low; mid += p.median; hi += p.ci_high; }
		return { base: s.points[0].median, lo: lo / n, mid: mid / n, hi: hi / n };
	    }

	    let sectionBaseline = 0;

	    function medianOf(values) {
		const a = [...values].sort((x, y) => x - y);
		const m = a.length >> 1;
		return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
	    }

	    const UNITS = [
		{ id: 'ns', label: 'ns', mult: 1e-3 },
		{ id: 'us', label: '\u00b5s', mult: 1 },
		{ id: 'ms', label: 'ms', mult: 1e3 },
		{ id: 's',  label: 's',  mult: 1e6 },
	    ];
	    let unitChoice = 'auto';
	    let unit = UNITS[1];

	    function pickUnit(reference) {
		if (unitChoice !== 'auto') return UNITS.find(u => u.id === unitChoice) || UNITS[1];
		const a = Math.abs(reference);
		if (!(a > 0)) return UNITS[1];
		let best = UNITS[1], score = Infinity;
		for (const u of UNITS) {
		    const s = Math.abs(Math.log10(a * u.mult) - 1.5);
		    if (s < score) { score = s; best = u; }
		}
		return best;
	    }

	    function fmtTp(v) {
		const s = v * unit.mult, a = Math.abs(s);
		if (a === 0) return '0';
		if (a < 1e-3 || a >= 1e6) return s.toExponential(2);
		return String(Number(s.toPrecision(3)));
	    }

	    function fmtTpDelta(v) {
		return (v >= 0 ? '+' : '\u2212') + fmtTp(Math.abs(v));
	    }

	    function fmtAxis(v, span) {
		const s = v * unit.mult, sp = Math.abs(span * unit.mult), a = Math.abs(s);
		if (a === 0) return '0';
		if (a < 1e-3 || a >= 1e6) return s.toExponential(2);
		const dec = Math.max(0, Math.min(9, Math.ceil(-Math.log10(sp || a)) + 1));
		return s.toFixed(dec);
	    }

	    function axisLabel() {
		return 'throughput (points/' + unit.label + ')';
	    }

	    function renderUnitPicker() {
		const host = document.getElementById('unit-picker');
		if (!host) return;
		const auto = unitChoice === 'auto' ? ` (${unit.label})` : '';
		host.innerHTML = `<span class="unit-lbl">per</span>` +
		    `<button data-unit="auto" class="${unitChoice === 'auto' ? 'active' : ''}">auto${auto}</button>` +
		    UNITS.map(u => `<button data-unit="${u.id}" class="${unitChoice === u.id ? 'active' : ''}">${u.label}</button>`).join('');
		host.querySelectorAll('button').forEach(b => b.addEventListener('click', e => {
		    spawnSparks(e.clientX, e.clientY, 'var(--accent)', 4);
		    setUnit(b.dataset.unit);
		}));
	    }

	    function setUnit(choice) {
		unitChoice = choice;
		unit = pickUnit(sectionBaseline);
		renderUnitPicker();
		if (!allSeries.length) return;
		renderSummary(allSeries);
		cardState.forEach((state, card) => {
		    const num = card.querySelector('.row-num');
		    if (num) num.textContent = fmtTp(state.series._st.lo);
		    const counts = card.querySelector('.chart-counts');
		    if (counts) counts.replaceWith(buildCounts(state.series));
		    if (state.plot) {
			state.plot.axes[1].label = axisLabel();
			state.plot.redraw(false, true);
		    }
		});
	    }

	    function plotRange(points) {
		const base = points[0].median;
		let d = 0;
		for (const p of points)
		    d = Math.max(d, Math.abs(p.ci_high - base), Math.abs(base - p.ci_low), Math.abs(p.median - base));
		if (!(d > 0)) d = Math.abs(base) * 0.1 || 1;
		const half = Math.max(d * 1.12, Math.abs(base));
		return [base - half, base + half];
	    }

	    function renderSection(data) {
		const scroll = document.getElementById('charts-scroll');
		scroll.innerHTML = '';
		resetCards();

		allSeries = (data || []).filter(s => s.points && s.points.length > 0);
		allSeries.forEach(s => { s._st = seriesStats(s); });
		allSeries.sort((a, b) => b._st.lo - a._st.lo);
		sectionBaseline = allSeries.length ? medianOf(allSeries.map(s => s._st.base)) : 0;
		unit = pickUnit(sectionBaseline);
		renderUnitPicker();

		if (allSeries.length === 0) {
		    document.getElementById('section-summary').innerHTML = '';
		    showEmpty('no locations');
		    return;
		}

		const displays = shortenLocations(allSeries.map(s => s.location));
		allSeries.forEach((s, i) => { s._display = displays[i]; s._idx = i; });

		renderSummary(allSeries);

		document.getElementById('empty-state').classList.add('hidden');
		scroll.style.display = 'flex';

		const scale = groupScale(allSeries);
		const frag = document.createDocumentFragment();
		allSeries.forEach((s, i) => frag.appendChild(buildCard(s, PALETTE[i % PALETTE.length], i, scale)));
		scroll.appendChild(frag);
	    }

	    function renderSummary(list) {
		const summary = document.getElementById('section-summary');
		const best = list[0]._st;

		summary.innerHTML =
		    `<span class="pill"><b>${list.length}</b> line${list.length !== 1 ? 's' : ''}</span>` +
		    `<span class="pill" title="${esc('baseline of the unmodified program, pooled across this section')}">` +
		    `baseline <b>${fmtTp(sectionBaseline)}</b></span>` +
		    `<span class="pill" title="${esc('floor of the best-ranked line')}">best <b>${fmtTp(best.lo)}</b></span>`;

		const lead = summary.querySelector('.pill b');
		if (lead) countUp(lead, list.length);
	    }

	    function shortenLocations(locs) {
		const paths = locs.filter(l => l.includes('/'));
		if (paths.length < 2) return locs;

		let prefix = paths[0];
		for (const p of paths) {
		    let k = 0;
		    while (k < prefix.length && k < p.length && prefix[k] === p[k]) k++;
		    prefix = prefix.slice(0, k);
		}
		const cut = prefix.lastIndexOf('/');
		const common = cut >= 0 ? prefix.slice(0, cut + 1) : '';
		if (!common) return locs;
		return locs.map(l => l.startsWith(common) ? l.slice(common.length) : l);
	    }

	    function expandCard(card) {
		if (card.classList.contains('expanded')) return;
		card.classList.add('expanded');

		const state = cardState.get(card);
		const chartEl = card.querySelector('.ip-chart');
		const chartBodyInner = card.querySelector('.ip-chart-body-inner');

		if (!state.plot) state.plot = buildPlot(chartEl, state.series, state.color);
		const size = () => {
		    const w = chartBodyInner.clientWidth - 16;
		    if (w <= 0) return false;
		    state.plot.setSize({ width: w, height: chartHeight(w) });
		    return true;
		};
		requestAnimationFrame(() => {
		    if (!size()) requestAnimationFrame(size);
		    state.plot._animateIn();
		});
	    }

	    function collapseCard(card) {
		card.classList.remove('expanded');
	    }

	    function groupScale(members) {
		if (!members.length) return null;
		const los = members.map(m => m._st.lo).sort((a, b) => a - b);
		const his = members.map(m => m._st.hi).sort((a, b) => a - b);
		const q = (arr, p) => arr[Math.max(0, Math.min(arr.length - 1, Math.round((arr.length - 1) * p)))];
		const d0 = Math.min(sectionBaseline, q(los, 0.05));
		const d1 = Math.max(q(his, 0.95), sectionBaseline);
		const pad = (d1 - d0) * 0.05 || Math.abs(d1) * 0.05 || 1;
		return { d0: d0 - pad, d1: d1 + pad };
	    }

	    function buildRowBand(st, scale, col) {
		if (!scale) return `<span class="row-band"></span>`;
		const X = v => Math.max(0, Math.min(100, (v - scale.d0) / (scale.d1 - scale.d0) * 100));
		const xLo = X(st.lo), xHi = X(st.hi), xMid = X(st.mid), x0 = X(sectionBaseline);
		return `<span class="row-band${st.hi > scale.d1 ? ' over' : ''}">` +
		    `<i class="rb-track"></i>` +
		    `<i class="rb-fill" style="left:${xLo.toFixed(2)}%;width:${Math.max(1.2, xHi - xLo).toFixed(2)}%;background:${col}"></i>` +
		    `<i class="rb-zero" style="left:${x0.toFixed(2)}%"></i>` +
		    `<i class="rb-mid" style="left:${xMid.toFixed(2)}%;background:${col};box-shadow:0 0 6px -1px ${col}"></i>` +
		    `</span>`;
	    }

	    const FLOOR_NOTE =
		'pside solves each level\'s median distribution in closed form over that level\'s own ' +
		'order statistics and keeps the middle 95%. Nothing is simulated, so the bounds are ' +
		'exact and identical on every run. This number averages the LOW end of that range ' +
		'across the whole ladder, in recorded throughput units, so it is the outcome your ' +
		'samples actually support rather than the one they hint at. It is never divided by a ' +
		'baseline: the ranking is absolute, so a line that speeds up a lot but carries little ' +
		'throughput stays where it belongs. Two limits: samples from the same run move ' +
		'together and pside can no longer tell them apart, so the range is a floor on the ' +
		'true width; and a bias that hit every measurement equally is invisible to it.';

	    function buildCounts(series) {
		const el = document.createElement('div');
		el.className = 'chart-counts';

		const st = series._st;
		const pts = series.points;
		let peak = 0;
		for (let i = 1; i < pts.length; i++) if (pts[i].median > pts[peak].median) peak = i;
		const flat = pts.filter(p => p.ci_low === p.ci_high).length;

		const stat = (k, v, cls = '', note = '') =>
		    `<div class="stat ${cls}"${note ? ` data-note="${esc(note)}"` : ''}>` +
		    `<span class="k">${k}</span><span class="v">${v}</span></div>`;

		el.innerHTML =
		    stat('baseline', fmtTp(st.base)) +
		    stat('peak', `${fmtTp(pts[peak].median)} <u>@ ${peak * 5}% speedup</u>`) +
		    stat('avg floor', `${fmtTp(st.lo)} <u>${fmtTpDelta(st.lo - st.base)}</u>`, '', FLOOR_NOTE) +
		    stat('avg median', `${fmtTp(st.mid)} <u>${fmtTpDelta(st.mid - st.base)}</u>`) +
		    (flat ? stat('flat levels', `${flat} <u>of ${pts.length}</u>`, 'thin',
				 'Every order statistic the 95% window spans holds the same value here, so the interval has no width. With few samples that window covers the whole level, so this usually means too few of them, or many identical ones. Record more runs.') : '');

		return el;
	    }

	    function buildCard(series, color, idx, scale) {
		const st = series._st;

		const card = document.createElement('div');
		card.className = 'ip-card';
		card.style.setProperty('--vc-fg', color);
		card.style.animationDelay = Math.min(idx * 12, 240) + 'ms';

		const header = document.createElement('div');
		header.className = 'ip-card-header';
		header.title = series.location;
		header.innerHTML =
		    `<span class="row-loc">${esc(series._display || series.location)}</span>` +
		    buildRowBand(st, scale, color) +
		    `<span class="row-num">${fmtTp(st.lo)}</span>` +
		    `<span class="ip-expand-icon">▶</span>`;

		const chartBody = document.createElement('div');
		chartBody.className = 'ip-chart-body';
		const chartBodyInner = document.createElement('div');
		chartBodyInner.className = 'ip-chart-body-inner';

		const legend = document.createElement('div');
		legend.className = 'chart-legend';
		legend.innerHTML =
		    `<span class="chart-legend-item">` +
		    `<svg width="24" height="10"><line x1="0" y1="5" x2="24" y2="5" stroke="${color}" stroke-width="2"/></svg>` +
		    `median throughput <span style="color:var(--text-mid);margin-left:2px">(raw, as recorded)</span></span>` +
		    `<span class="chart-legend-item">` +
		    `<svg width="20" height="10"><rect x="0" y="1" width="20" height="8" rx="1" fill="${color}" fill-opacity="0.22"/><line x1="0" y1="1" x2="20" y2="1" stroke="${color}" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="3,3"/><line x1="0" y1="9" x2="20" y2="9" stroke="${color}" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="3,3"/></svg>` +
		    `95% confidence interval</span>` +
		    `<span class="chart-legend-item">` +
		    `<svg width="24" height="10"><line x1="0" y1="5" x2="24" y2="5" stroke="rgba(124,135,152,0.85)" stroke-width="1" stroke-dasharray="1,3"/></svg>` +
		    `baseline <span style="color:var(--text-mid);margin-left:2px">(unmodified program, centred by construction)</span></span>` +
		    `<span class="chart-legend-item">` +
		    `<svg width="12" height="12"><polygon points="6,1 11,11 1,11" fill="${color}" fill-opacity="0.9"/></svg>` +
		    `flat level <span style="color:var(--text-mid);margin-left:2px">(interval collapsed to a point)</span></span>`;

		const chartEl = document.createElement('div');
		chartEl.className = 'ip-chart';
		chartBodyInner.appendChild(chartEl);
		chartBodyInner.appendChild(legend);
		chartBodyInner.appendChild(buildCounts(series));
		chartBody.appendChild(chartBodyInner);

		card.appendChild(header);
		card.appendChild(chartBody);

		cardState.set(card, { plot: null, series, color });

		header.addEventListener('click', (e) => {
		    const willExpand = !card.classList.contains('expanded');
		    spawnSparks(e.clientX, e.clientY, color, willExpand ? 6 : 3);
		    if (willExpand) expandCard(card); else collapseCard(card);
		});

		return card;
	    }

	    function buildPlot(chartEl, series, color) {
		const pts     = series.points;
		const xVals   = pts.map((_, i) => i);
		const medians = pts.map(p => p.median);
		const ciLow   = pts.map(p => p.ci_low);
		const ciHigh  = pts.map(p => p.ci_high);
		const base    = pts[0].median;

		const [yMin, yMax] = plotRange(pts);
		const span = yMax - yMin;

		const rv = parseInt(color.slice(1,3),16);
		const gv = parseInt(color.slice(3,5),16);
		const bv = parseInt(color.slice(5,7),16);

		let animT = reducedMotion ? 1 : 0;
		const grow = arr => arr.map(v => base + (v - base) * animT);

		const tip = document.createElement('div');
		tip.className = 'chart-tip';

		const opts = {
		    width:  800,
		    height: chartHeight(800),
		    legend: { show: false },
		    cursor: {
			show: true,
			y: false,
			points: { show: true, size: 8, width: 2, stroke: () => 'rgba(255,255,255,0.9)', fill: () => color },
		    },
		    scales: {
			x: { time: false },
			y: { range: () => [yMin, yMax] },
		    },
		    series: [
			{},
			{ stroke: color, width: 2.5, paths: uPlot.paths.spline(), points: { show: false } },
			{ show: false, points: { show: false } },
			{ show: false, points: { show: false } },
		    ],
		    hooks: {
			init: [u => { u.over.appendChild(tip); }],
			drawClear: [u => {
			    const { ctx, bbox: { left, top, width } } = u;
			    const yBase = u.valToPos(base, 'y', true);

			    ctx.save();
			    ctx.strokeStyle = 'rgba(124,135,152,0.85)';
			    ctx.lineWidth = 1;
			    ctx.setLineDash([1, 3]);
			    ctx.beginPath();
			    ctx.moveTo(left, yBase);
			    ctx.lineTo(left + width, yBase);
			    ctx.stroke();
			    ctx.setLineDash([]);
			    ctx.restore();
			}],
			draw: [u => {
			    const { ctx, bbox: { left, top, width, height } } = u;
			    ctx.save();
			    ctx.beginPath(); ctx.rect(left, top, width, height); ctx.clip();

			    const LO = u.data[2], HI = u.data[3];
			    const hiPts = xVals.map((x, i) => ({ x: u.valToPos(x,'x',true), y: u.valToPos(HI[i],'y',true) }));
			    const loPts = xVals.map((x, i) => ({ x: u.valToPos(x,'x',true), y: u.valToPos(LO[i],'y',true) }));

			    ctx.fillStyle = `rgba(${rv},${gv},${bv},0.18)`;
			    ctx.beginPath();
			    drawSpline(ctx, hiPts, false);
			    drawSpline(ctx, loPts, true);
			    ctx.closePath();
			    ctx.fill();

			    ctx.strokeStyle = `rgba(${rv},${gv},${bv},0.50)`;
			    ctx.lineWidth = 1;
			    ctx.setLineDash([3,4]);
			    [hiPts, loPts].forEach(pts2 => {
				ctx.beginPath();
				ctx.moveTo(pts2[0].x, pts2[0].y);
				drawSpline(ctx, pts2, false);
				ctx.stroke();
			    });
			    ctx.setLineDash([]);

			    ctx.fillStyle = `rgba(${rv},${gv},${bv},0.9)`;
			    pts.forEach((p, i) => {
				if (p.ci_low !== p.ci_high) return;
				const x = u.valToPos(i,'x',true);
				const y = u.valToPos(base + (p.median - base) * animT, 'y',true);
				ctx.beginPath();
				ctx.moveTo(x, y-7); ctx.lineTo(x-5, y+4); ctx.lineTo(x+5, y+4);
				ctx.closePath(); ctx.fill();
			    });

			    ctx.restore();
			}],
			setCursor: [u => {
			    const idx = u.cursor.idx;
			    if (idx == null) { tip.style.opacity = '0'; return; }
			    const flat = ciLow[idx] === ciHigh[idx];
			    tip.innerHTML =
				`<span class="tip-val" style="color:${color}">${fmtTp(medians[idx])}</span>` +
				`<span class="tip-spd">${idx === 0 ? 'baseline' : fmtTpDelta(medians[idx] - base)}</span>` +
				(flat ? '' : `<span class="tip-ci">${fmtTp(ciLow[idx])}–${fmtTp(ciHigh[idx])}</span>`) +
				`<span class="tip-n">@${idx * 5}%</span>`;
			    tip.style.left = u.valToPos(xVals[idx], 'x') + 'px';
			    tip.style.top  = u.valToPos(ciHigh[idx], 'y') + 'px';
			    tip.style.opacity = '1';
			}],
		    },
		    axes: [
			{
			    font: '11px monospace', stroke: '#9aa6b6',
			    grid: { stroke: '#2a3040', width: 1 },
			    ticks: { stroke: '#252a33', width: 1 },
			    label: 'virtual speedup %',
			    labelFont: '10px monospace',
			    splits: () => {
				const major = [];
				for (let i = 0; i <= 20; i += 2) major.push(i);
				return major;
			    },
			    values: (u, splits) => splits.map(v => v == null ? '' : (v * 5).toFixed(0) + '%'),
			},
			{
			    font: '11px monospace', stroke: '#9aa6b6',
			    grid: { stroke: '#2a3040', width: 1 }, ticks: { stroke: '#252a33', width: 1 },
			    label: axisLabel(), labelFont: '10px monospace',
			    size: 68,
			    values: (u, splits) => splits.map(v => v == null ? '' : fmtAxis(v, span)),
			},
		    ],
		};

		const u = new uPlot(opts, [xVals, grow(medians), grow(ciLow), grow(ciHigh)], chartEl);

		u._animateIn = () => {
		    if (reducedMotion) { animT = 1; u.setData([xVals, medians, ciLow, ciHigh]); return; }
		    animT = 0;
		    u.setData([xVals, grow(medians), grow(ciLow), grow(ciHigh)]);
		    const dur = 480, start = performance.now();
		    const tick = now => {
			const p = Math.min(1, (now - start) / dur);
			animT = 1 - Math.pow(1 - p, 3);
			u.setData([xVals, grow(medians), grow(ciLow), grow(ciHigh)]);
			if (p < 1) requestAnimationFrame(tick);
		    };
		    requestAnimationFrame(tick);
		};

		return u;
	    }

	    function drawSpline(ctx, points, reverse) {
		const pts = reverse ? [...points].reverse() : points;
		ctx.lineTo(pts[0].x, pts[0].y);
		for (let i = 0; i < pts.length - 1; i++) {
		    const p0 = pts[Math.max(i-1,0)], p1 = pts[i],
			p2 = pts[i+1],             p3 = pts[Math.min(i+2,pts.length-1)];
		    for (let t = .1; t <= 1; t += .1) {
			const t2=t*t, t3=t2*t;
			ctx.lineTo(
			    .5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
			    .5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
			);
		    }
		}
	    }

	    function showEmpty(msg, loading = false) {
		const emptyEl  = document.getElementById('empty-state');
		const scrollEl = document.getElementById('charts-scroll');
		scrollEl.style.display = 'none';
		emptyEl.classList.remove('hidden');
		emptyEl.querySelector('.big').style.display = loading ? 'none' : '';
		const msgEl = document.getElementById('empty-msg');
		if (loading) {
		    msgEl.innerHTML = `<div class="spinner"></div>`;
		} else {
		    msgEl.textContent = msg ?? 'no section selected';
		}
	    }

	    window.addEventListener('resize', () => {
		cardState.forEach((state, card) => {
		    if (!state.plot || !card.classList.contains('expanded')) return;
		    const body = card.querySelector('.ip-chart-body-inner');
		    const w = body.clientWidth - 16;
		    if (w > 0) state.plot.setSize({ width: w, height: chartHeight(w) });
		});
	    });

	    function esc(s) {
		return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
	    }

	    if (!reducedMotion) {
		const grid = document.getElementById('bg-grid');
		let queued = false, mx = 0, my = 0;
		window.addEventListener('pointermove', e => {
		    mx = (e.clientX / window.innerWidth  - 0.5) * -18;
		    my = (e.clientY / window.innerHeight - 0.5) * -12;
		    if (queued) return;
		    queued = true;
		    requestAnimationFrame(() => {
			grid.style.setProperty('--gx', mx.toFixed(1) + 'px');
			grid.style.setProperty('--gy', my.toFixed(1) + 'px');
			queued = false;
		    });
		}, { passive: true });
	    }
	</script>
    </body>
